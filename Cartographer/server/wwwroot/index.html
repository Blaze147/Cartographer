<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartographer</title>
<!-- Static favicon for browsers that don't refresh icons (Safari). The JS
     below swaps this same link's href for a canvas-drawn badge version in
     browsers that do. -->
<link rel="icon" href="/favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  table td, table th { vertical-align: middle; }
  .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .dot-green  { background:#28a745; }
  .dot-orange { background:#fd7e14; }
  .dot-red    { background:#dc3545; }
  .dot-gray   { background:#6c757d; }
  .fl-added   { color:#28a745; }   /* files added   */
  .fl-modified{ color:#fd7e14; }   /* files edited  */
  .fl-deleted { color:#dc3545; }   /* files removed */
  .hidden { display:none; }
  /* Top-right "Models" toggle: sits quietly in the dark navbar. */
  #modelsDropdown {
    border-color: rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    box-shadow: 0 1px 3px rgba(0,0,0,.45);
    color: #ced4da;
  }
  #modelsDropdown:hover, #modelsDropdown:focus {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.3);
    color: #fff;
  }
  #modelsDropdown .badge { box-shadow: none; }
  /* Per-experiment … menu button: intentionally tiny and unobtrusive. */
  .exp-gear {
    color: #adb5bd !important;
    padding: 0 .45rem;
    line-height: 1.4;
    font-weight: 700;
  }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand d-flex align-items-center gap-2">
      <img src="/images/compass-512x512.png" alt="" width="28" height="28"
         title="Cartographer — the compass of this expedition">
      Cartographer
    </span>
    <span class="navbar-text text-warning small" id="authMsg"></span>
    <!-- Model catalog lives behind a settings dropdown so it costs no page space. -->
    <div class="dropdown ms-auto">
      <button class="btn btn-primary btn-sm me-2" data-bs-toggle="modal" data-bs-target="#startModal">
        + New experiment
      </button>
      <button class="btn btn-outline-light btn-sm dropdown-toggle" id="modelsDropdown"
              data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
        Models <span class="badge text-bg-secondary" id="modelCount">0</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end p-3" style="min-width:20rem;">
        <div class="d-flex gap-2">
          <input id="newModel" class="form-control form-control-sm" style="flex:1;"
            placeholder="e.g. gpt-5.2, glm-5.3" onkeydown="if(event.key==='Enter')addModel()">
          <button class="btn btn-sm btn-outline-primary" onclick="addModel()">Add</button>
        </div>
        <div id="modelList" class="d-flex flex-wrap gap-1 mt-2"></div>
        <div class="text-muted small mt-2" style="max-width:18rem;">
          Claude Code / Codex force their own proprietary models — the
          experimental model picker applies only to other harnesses.
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- Machines -->
  <div class="card mb-4">
    <div class="card-header">Machines</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm table-striped mb-0">
          <thead><tr>
            <th>Machine</th><th>Harness</th><th>State</th><th>Branch</th><th>Repo</th><th>Last error</th>
          </tr></thead>
          <tbody id="machinesBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Divider: machines are fleet status, experiments are results — keep them apart. -->
  <hr class="mb-4" style="border-top:2px solid rgba(0,0,0,.12);width:100%;opacity:1;">

  <!-- Experiments / results -->
  <div id="experimentsWrap"></div>
</div>

<!-- New-experiment modal: same fields, defaults and rollover logic as the
     old inline card; ids are unchanged so the JS keeps working. -->
<div class="modal fade" id="startModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title small fw-bold">Start Experiment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label small">Baseline tag</label>
            <input id="baseline" class="form-control form-control-sm" value="baseline/b001" placeholder="baseline/b001">
          </div>
          <div class="col-md-2">
            <label class="form-label small">Task number</label>
            <input id="task" class="form-control form-control-sm" type="number" min="1" value="1">
          </div>
          <div class="col-md-2">
            <label class="form-label small">Attempt number</label>
            <input id="attempt" class="form-control form-control-sm" type="number" min="1" value="1">
          </div>
          <div class="col-md-4">
            <label class="form-label small">Model</label>
            <select id="model" class="form-select form-select-sm">
              <option value="">— none —</option>
            </select>
          </div>
        </div>
        <div class="mt-2">
          <label class="form-label small">Prompt</label>
          <textarea id="prompt" class="form-control form-control-sm" rows="5"
            placeholder="Task text goes here"></textarea>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button id="startBtn" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Start experiment</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = sel => document.querySelector(sel);

// Optional web password prompt. If the server returns 401, ask for a
// password and store it in a cookie so page reloads keep working.
async function authedFetch(url, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['Content-Type'] = 'application/json';
  const res = await fetch(url, opts);
  if (res.status === 401) {
    const pw = prompt('Cartographer is password-protected. Enter web password:');
    if (pw !== null) {
      document.cookie = 'cartographer_auth=' + pw + ';path=/;max-age=86400';
      location.reload();
    }
    return res;
  }
  return res;
}

async function refresh() {
  loadMachines();
  loadExperiments();
  loadModels();
}

// ---- Model tracking -----------------------------------------------------

let modelOptions = [];   // the persisted server-side catalog

// Harnesses whose vendor forces proprietary models: the model picker does
// not apply and run rows there show "n/a" instead of a model.
function modelApplies(harness) {
  const h = (harness || '').toLowerCase();
  return h !== '' && !h.includes('claude code') && !h.includes('codex');
}

async function loadModels() {
  const res = await authedFetch('/api/models');
  if (!res.ok) return;
  const models = await res.json();
  if (JSON.stringify(models) === JSON.stringify(modelOptions)) return;
  const firstLoad = modelOptions.length === 0 && models.length > 0;
  modelOptions = models;
  renderModelList();
  renderModelSelect('#model');           // start form
  // The experiments table is skipped by loadExperiments when nothing changed,
  // so on the first catalog fill force the header selects to rebuild now.
  if (firstLoad) { lastExperiments = null; await loadExperiments(); }
}

// Populate a model <select>, keeping the same value selected when possible.
// Selecting an experiment's saved model keeps working even after someone
// removes it from the catalog: it is shown and remains valid.
function renderModelSelect(sel, selected) {
  const el = $(sel);
  if (!el) return;
  const keep = selected !== undefined ? selected : el.value;
  const opts = [`<option value="">— none —</option>`,
    ...modelOptions.map(m =>
      `<option value="${esc(m)}" ${m === keep ? 'selected' : ''}>${esc(m)}</option>`) ];
  if (keep && !modelOptions.includes(keep) && keep !== '')
    opts.push(`<option value="${esc(keep)}" selected>${esc(keep)} (removed from catalog)</option>`);
  el.innerHTML = opts.join('');
}

function renderModelList() {
  const wrap = $('#modelList');
  if (!wrap) return;
  wrap.innerHTML = modelOptions.length
    ? modelOptions.map(m =>
        `<div class="d-flex justify-content-between align-items-center w-100 py-1 border-bottom">
           <span class="small">${esc(m)}</span>
           <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2"
             onclick="removeModel('${esc(m)}')" title="Remove from catalog">&times;</button>
         </div>`).join('')
    : '<div class="text-muted small">No models in the catalog yet — add one above.</div>';
  const count = $('#modelCount');
  if (count) count.textContent = modelOptions.length;
}

async function addModel() {
  const name = $("#newModel").value.trim();
  if (!name) return;
  const res = await authedFetch('/api/models', { method: 'POST', body: JSON.stringify({ name }) });
  if (res.ok) { $("#newModel").value = ''; await loadModels(); }
}

async function removeModel(name) {
  if (!confirm(`Remove "${name}" from the model catalog?\nExperiments already tagged with it keep their recorded value.`)) return;
  const res = await authedFetch('/api/models/' + encodeURIComponent(name), { method: 'DELETE' });
  if (res.ok) await loadModels();
}

// Pick the model for an experiment from its header dropdown. The server
// copies the choice onto every model-eligible run of the experiment.
async function saveExpModel(expId, value) {
  const res = await authedFetch(`/api/experiments/${expId}/model`, {
    method: 'POST', body: JSON.stringify({ model: value })
  });
  if (res.ok) await loadExperiments();
}

// Show the model recorded for a run row. Proprietary-model harnesses
// (Claude Code, Codex) force their own model: show "n/a", never a picker.
function modelCell(exp, r) {
  if (!modelApplies(r.harness)) return '<span class="text-muted small" title="Vendor forces its own models">n/a</span>';
  const m = r.model || exp.model || '';
  return m ? `<span class="small">${esc(m)}</span>` : '<span class="text-muted small">—</span>';
}

async function loadMachines() {
  const res = await authedFetch('/api/machines');
  if (!res.ok) return;
  const ms = await res.json();
  updateTabStatus(ms);
  $("#machinesBody").innerHTML = ms.map(m => `
    <tr>
      <td>${esc(m.machineId)}</td>
      <td>${esc(m.harness || '')}</td>
      <td>${dot(m.state)}</td>
      <td class="mono small">${esc(m.branch || '')}</td>
      <td class="small">${esc(m.repositoryPath || '')}</td>
      <td class="small text-danger">${esc(m.lastError || '')}</td>
    </tr>`).join('');
}

// ---- Browser tab / favicon live status ---------------------------------

// Two reinforcing mechanisms:
//   1. the tab title carries the exact count: "Cartographer (2/5)";
//   2. the favicon is a canvas-drawn compass mark whose badge shows the
//      number of connected machines (nothing = 0 connected shows a dash).
// Both run from /api/machines data ("online" = fresh heartbeat), so they
// refresh on the normal 5s refresh timer — no extra polling.
function updateTabStatus(ms) {
  const online = ms.filter(m => m.online).length;
  const total = ms.length;
  // "Cartographer" stays first so the tab always reads as app-plus-count,
  // never a bare "(n/m)".
  document.title = `Cartographer (${online}/${total})`;
  //drawFavicon(online, total);
}

function dot(state) {
  // Green: agent ran and finished. Red: error or lost heartbeat (crash,
  // network drop, power loss). Orange: actively working. Gray: idle or a
  // clean shutdown reported by the agent itself (agent said "Stopped").
  const cls = state === 'Ready' || state === 'Collected' ? 'dot-green'
    : (state === 'Offline' || state === 'Error') ? 'dot-red'
    : (state === 'Preparing' || state === 'Collecting' || state === 'Working') ? 'dot-orange'
    : 'dot-gray';
  return `<span class="status-dot ${cls}"></span>${esc(state)}`;
}

// ---- Experiments ------------------------------------------------------

let lastExperiments = null;  // JSON snapshot of the experiments we last rendered

async function loadExperiments() {
  const res = await authedFetch('/api/experiments');
  if (!res.ok) return;
  const exps = await res.json();
  const snap = JSON.stringify(exps);
  // Nothing changed since the last render: leave the DOM alone so the user's
  // in-progress typing, caret, expanded files rows and open diffs stay
  // exactly as they are instead of being wiped by the auto-refresh timer.
  if (snap === lastExperiments) return;
  lastExperiments = snap;
  // Experiments arrive newest-first; use the latest one to default the
  // next-experiment form.
  applyStartFormDefaults(exps);
  captureCurrentFocus();
  captureExpandedState();
  $("#experimentsWrap").innerHTML = exps.map(exp => renderExp(exp)).join('');
  restoreDirty();
  restoreExpandedState();
}

function renderExp(exp) {
  const branch = branchName(exp);
  const rows = exp.runs.map(r => `
    <tr>
      <td>${dotForRun(r)}</td>
      <td>${esc(r.harness || '')}</td>
      <td>${modelCell(exp, r)}</td>
      <td>
        <select id="f-${exp.id}-${r.machineId}-completion" data-exp="${exp.id}" data-mach="${r.machineId}" data-field="completion" class="form-select form-select-sm"
          oninput="markDirty('${exp.id}','${r.machineId}','completion',this.value)"
          onchange="saveRun('${exp.id}','${r.machineId}','completion',this.value)">
          <option value="" ${r.completion===''?'selected':''}>—</option>
          <option value="Completed" ${r.completion==='Completed'?'selected':''}>Completed</option>
          <option value="Aborted" ${r.completion==='Aborted'?'selected':''}>Aborted</option>
        </select>
      </td>
      <td><input id="f-${exp.id}-${r.machineId}-score" data-exp="${exp.id}" data-mach="${r.machineId}" data-field="score" class="form-control form-control-sm" style="width:70px" type="number" step="0.5"
           value="${r.score ?? ''}"
           oninput="markDirty('${exp.id}','${r.machineId}','score',this.value)"
           onkeydown="enterBlur(event)"
           onchange="saveRun('${exp.id}','${r.machineId}','score',this.value)"></td>
      <td><input id="f-${exp.id}-${r.machineId}-elapsedTime" data-exp="${exp.id}" data-mach="${r.machineId}" data-field="elapsedTime" class="form-control form-control-sm" style="width:90px"
           value="${esc(r.elapsedTime || '')}" placeholder="?:??"
           oninput="markDirty('${exp.id}','${r.machineId}','elapsedTime',this.value)"
           onkeydown="enterBlur(event)"
           onchange="saveRun('${exp.id}','${r.machineId}','elapsedTime',this.value)"></td>
      <td><input id="f-${exp.id}-${r.machineId}-tokens" data-exp="${exp.id}" data-mach="${r.machineId}" data-field="tokens" class="form-control form-control-sm" style="width:90px"
           value="${esc(r.tokens || '')}" placeholder="?"
           oninput="markDirty('${exp.id}','${r.machineId}','tokens',this.value)"
           onkeydown="enterBlur(event)"
           onchange="saveRun('${exp.id}','${r.machineId}','tokens',this.value)"></td>
      <td>${filesCell(r)}</td>
      <td>${linesCell(r)}</td>
      <td><button class="btn btn-sm btn-outline-primary" onclick="toggleFiles('${exp.id}','${r.machineId}')">…</button></td>
      <td class="small"><div class="d-flex">
        <input id="f-${exp.id}-${r.machineId}-notes" data-exp="${exp.id}" data-mach="${r.machineId}" data-field="notes" class="form-control form-control-sm me-1" placeholder="notes"
          value="${esc(r.notes || '')}"
          oninput="markDirty('${exp.id}','${r.machineId}','notes',this.value)"
          onkeydown="enterBlur(event)"
          onchange="saveRun('${exp.id}','${r.machineId}','notes',this.value)">
      </div></td>
    </tr>
    <tr class="files-row hidden" id="files-${exp.id}-${r.machineId}"><td colspan="11" class="small">
      Changed files:<div class="mono">${esc((r.changedFiles||[]).join(', ') || '(none)')}</div>
      <details id="detail-${exp.id}-${r.machineId}"><summary>Full diff</summary><pre class="mono small bg-white border p-2">${esc(r.diff||'(none)')}</pre></details>
    </td></tr>`).join('');

  return `
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>
        <strong>${esc(exp.baseline)}</strong> · Task ${exp.taskNumber} · Attempt ${exp.attemptNumber}
        <span class="text-muted small">(${esc(exp.id.slice(0,8))})</span>
        <span class="ms-2 mono small text-info">${esc(branch)}</span>
      </span>
      <span class="d-flex align-items-center gap-2">
        ${modelSelectHtml(exp)}
        <button class="btn btn-warning btn-sm" onclick="complete('${exp.id}')">Complete experiment</button>
      </span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm table-striped mb-0">
          <thead><tr>
            <th>State</th><th>Harness</th><th>Model</th><th>Status</th><th>Score</th><th>Time</th><th>Tokens</th>
            <th>Files</th><th>Lines</th><th></th><th>Notes</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="11" class="text-muted">No runs yet — agents collect when you click Complete.</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="card-footer small text-muted">Prompt: ${esc(exp.prompt || '')}</div>
  </div>`;
}

// The experiment header's model picker: deliberately tucked into a small
// "…" ellipse button instead of occupying bar space, since the model is
// usually set once at experiment start.
function modelSelectHtml(exp) {
  const chosen = exp.model ?? exp.Model;
  const opts = [`<option value="">— none —</option>`]
    .concat(modelOptions.map(m =>
      `<option value="${esc(m)}" ${m === chosen ? 'selected' : ''}>${esc(m)}</option>`));
  if (chosen && !modelOptions.includes(chosen))
    opts.push(`<option value="${esc(chosen)}" selected>${esc(chosen)} (removed from catalog)</option>`);
  return `<div class="dropdown ms-1">
    <button class="btn btn-outline-secondary btn-sm exp-gear" title="Models"
      data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
      aria-label="Experiment model settings">…</button>
    <div class="dropdown-menu dropdown-menu-end p-2" style="min-width:12rem;">
      <label class="small text-muted mb-1 d-block">Model:</label>
      <select class="form-select form-select-sm"
        onchange="saveExpModel('${exp.id}', this.value)">
        ${opts.join('')}
      </select>
      <div class="text-muted" style="font-size:.75rem; margin-top:.4rem;">
        Claude Code / Codex runs are forced to their own proprietary models.
      </div>
    </div>
  </div>`;
}

// A run's dot: manual completion wins; then collected data ("Collected");
// otherwise show the live agent state mirrored in from the machine's
// heartbeat (Ready, Working, Collecting, ...), or 'Pending' before the agent
// has reported anything for this run.
function dotForRun(r) {
  return dot(r.completion ? r.completion
    : ((r.filesChanged > 0 || r.collectedAtUtc) ? 'Collected'
    : (r.agentState || 'Pending')));
}

// The "Files" column: total files affected, followed by the add/modify/
// delete breakdown as soon as collection data exists. Counts are absent
// before collection, so just show nothing there (like the other git-stat
// columns). Unicode ~ / − keep the breakdown visually light.
function filesCell(r) {
  if (r.filesChanged === undefined || r.filesChanged === null) return '';
  // Only render a breakdown once collection filled it in: git reports
  // add/modify/delete per file, so a genuinely zero case still sums to
  // filesChanged whereas a never-collected row has undefined parts.
  const known = r.filesAdded !== undefined && r.filesModified !== undefined
    && r.filesDeleted !== undefined;
  if (!known) return `${esc(r.filesChanged)}`;
  const b = [];
  if (r.filesAdded) b.push(`<span class="fl-added">+${r.filesAdded}</span>`);
  if (r.filesModified) b.push(`<span class="fl-modified">~${r.filesModified}</span>`);
  if (r.filesDeleted) b.push(`<span class="fl-deleted">−${r.filesDeleted}</span>`);
  return `${esc(r.filesChanged)}${b.length ? ` <span class="text-muted small">(${b.join(' ')})</span>` : ''}`;
}

// The "Lines" column: line additions and deletions condensed into one
// color-coded cell (+N green, −N red), matching the Files breakdown.
function linesCell(r) {
  const a = r.linesAdded, d = r.linesDeleted;
  if (a === undefined || a === null) return '';
  const b = [];
  if (a) b.push(`<span class="fl-added">+${a}</span>`);
  if (d) b.push(`<span class="fl-deleted">−${d}</span>`);
  if (!b.length) return '<span class="text-muted small">0</span>';
  return b.join(' ');
}

// Display the branch pattern for this experiment, not one machine's actual
// branch. Each run checks out its own branch whose third segment is that
// machine's harness slug (see BranchName() in Program.cs), so the header
// shows "*harness*" as a stand-in: "b001/task-001/*harness*/01". The full
// per-machine branch names appear on the run rows and in the commands list.
function branchName(exp) {
  const fromCmd = (exp.commands && exp.commands[0] && exp.commands[0].branchName) || '';
  if (fromCmd) {
    const parts = fromCmd.split('/');
    if (parts.length === 4 && parts[2] !== '*harness*') parts[2] = '*harness*';
    return parts.join('/');
  }
  let tag = exp.baseline.trim();
  if (tag.startsWith('baseline')) tag = tag.slice(8);
  // The new "baseline/bXXX" spelling leaves a leading separator behind.
  tag = tag.replace(/^[/\s]+/, '');
  const safe = s => s.trim().replace(/\s+/g, '_').toLowerCase();
  return `${safe(tag)}/task-${String(exp.taskNumber).padStart(3,'0')}/*harness*/${String(exp.attemptNumber).padStart(2,'0')}`;
}

function toggleFiles(expId, machineId) {
  const el = $('#files-' + expId + '-' + machineId);
  if (el) el.classList.toggle('hidden');
}

// Which "files" rows are currently expanded and which <details> blocks are
// open, keyed by element id, so a genuine re-render doesn't collapse them.
const expandedRows = new Set();
const openDetails = new Set();

function captureExpandedState() {
  expandedRows.clear();
  document.querySelectorAll('.files-row').forEach(row => {
    if (!row.classList.contains('hidden')) expandedRows.add(row.id);
  });
  openDetails.clear();
  document.querySelectorAll('.files-row details').forEach(d => {
    if (d.open) openDetails.add(d.id);
  });
}

function restoreExpandedState() {
  expandedRows.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('hidden');
  });
  openDetails.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.open = true;
  });
}

// The run tables are rebuilt on every auto-refresh (5s). Fields are saved on
// "change" (blur/Enter), not on every keystroke, so without this a refresh
// would wipe out whatever the user is still typing and drop focus from the
// field they're editing. We remember unsaved ("dirty") values plus the field
// that currently holds focus (and its caret position), then re-apply all of
// it to the freshly built inputs so typing continues seamlessly.
const dirtyFields = {};   // fieldKey -> value being typed
let focusedField = null;  // { expId, machineId, field }
let caretStart = 0;
let caretEnd = 0;

function fieldKey(expId, machineId, field) {
  return expId + '|' + machineId + '|' + field;
}

function parseKey(key) {
  const a = key.indexOf('|');
  const b = key.indexOf('|', a + 1);
  return {
    expId: key.slice(0, a),
    machineId: key.slice(a + 1, b),
    field: key.slice(b + 1)
  };
}

function fieldEl(expId, machineId, field) {
  return document.getElementById('f-' + expId + '-' + machineId + '-' + field);
}

function markDirty(expId, machineId, field, value) {
  dirtyFields[fieldKey(expId, machineId, field)] = value;
}

function clearDirty(expId, machineId, field) {
  delete dirtyFields[fieldKey(expId, machineId, field)];
}

// Pressing Enter in a run field commits the value (blur fires "change",
// which saves) and drops focus so the user isn't stuck in the field.
function enterBlur(e) {
  if (e.key === 'Enter') e.currentTarget.blur();
}

function setCaret(el) {
  if (el && typeof el.selectionStart === 'number') {
    caretStart = el.selectionStart;
    caretEnd = el.selectionEnd;
  }
}

// Read the currently focused run field and its live caret position from the
// real DOM element, right before we rebuild the table. This is the source of
// truth for where to put focus + cursor back after re-rendering — it avoids
// relying on event bookkeeping that can be clobbered during the re-render.
function captureCurrentFocus() {
  const el = document.activeElement;
  if (el && el.dataset && el.dataset.exp !== undefined && el.dataset.field !== undefined) {
    focusedField = { expId: el.dataset.exp, machineId: el.dataset.mach, field: el.dataset.field };
    setCaret(el);
  } else {
    focusedField = null;
  }
}

// After a re-render: put back any values the user was mid-typing, and restore
// focus + caret to the field they were actively editing.
function restoreDirty() {
  for (const key of Object.keys(dirtyFields)) {
    const { expId, machineId, field } = parseKey(key);
    const el = fieldEl(expId, machineId, field);
    if (el) el.value = dirtyFields[key];
  }
  if (focusedField) {
    const el = fieldEl(focusedField.expId, focusedField.machineId, focusedField.field);
    if (el) {
      // Save locals first: assigning .value and calling .focus() reset the
      // caret to 0, so restore the position from what we captured before.
      const s = caretStart;
      const e = caretEnd;
      el.focus();
      try { el.setSelectionRange(s, e); } catch (_) {}
    }
  }
}

async function saveRun(expId, machineId, field, value) {
  const payload = { [field]: field === 'score' ? (value === '' ? null : Number(value)) : value };
  const res = await authedFetch(`/api/experiments/${expId}/runs/${machineId}`, {
    method: 'POST', body: JSON.stringify(payload)
  });
  if (res.ok) {
    clearDirty(expId, machineId, field);
    // Re-sync the rendered snapshot with the now-confirmed server state. If we
    // don't, an auto-refresh can rebuild this field from the pre-save snapshot
    // and "wipe" the change back to its old value (e.g. Status flickering back
    // to '—'). loadExperiments keeps typing/caret and expanded rows intact and
    // skips work entirely when nothing else changed.
    await loadExperiments();
  }
}

async function complete(expId) {
  if (!confirm('Complete this experiment? Every registered machine will auto-commit its changes and collect its results.')) return;
  const res = await authedFetch(`/api/experiments/${expId}/complete`, { method: 'POST' });
  if (res.ok) refresh();
}

// ---- Start form defaults ----------------------------------------------

// Defaults for the next experiment, taken from the most recent experiment:
// same baseline, same task number, attempt_continue = last + 1.
let lastExperimentDefaults = null;

// Fields the user has explicitly edited keep their value; the auto-defaults
// never fight with manual input.
const startFormTouched = { baseline: false, task: false, attempt: false, model: false };

function applyStartFormDefaults(exps) {
  const last = exps && exps[0];
  if (!last) return;
  lastExperimentDefaults = last;
  const taskEl = $("#task");
  if (!startFormTouched.baseline) $("#baseline").value = last.baseline;
  if (!startFormTouched.task) taskEl.value = last.taskNumber;
  if (!startFormTouched.model) renderModelSelect('#model', last.model || last.Model || '');
  if (!startFormTouched.attempt) {
    // If the user already steered the task number away from the last
    // experiment's task (see the listener below), a new task starts the
    // attempt counter at 1; otherwise continue with attempt + 1.
    const taskChanged = startFormTouched.task && Number(taskEl.value) !== last.taskNumber;
    $("#attempt").value = taskChanged ? 1 : last.attemptNumber + 1;
  }
}

// Changing the task number to something other than the last experiment's
// task means the user is starting a fresh task: reset the attempt counter.
$("#task").addEventListener('input', () => {
  const d = lastExperimentDefaults;
  if (d && Number($("#task").value) !== d.taskNumber) $("#attempt").value = 1;
});

// A new baseline tag means numbers must not carry over from the old
// baseline: reset task and attempt counters to 1. Touching the fields here
// keeps the auto-defaults from overwriting the reset with values derived
// from the previous experiment.
$("#baseline").addEventListener('input', () => {
  $("#task").value = 1;
  $("#attempt").value = 1;
  startFormTouched.task = true;
  startFormTouched.attempt = true;
});

['baseline', 'task', 'attempt'].forEach(id => {
  $("#"+id).addEventListener('input', () => { startFormTouched[id] = true; });
});
$("#model").addEventListener('change', () => { startFormTouched.model = true; });

// ---- Start experiment -------------------------------------------------

async function startExperiment() {
  const payload = {
    baseline: $("#baseline").value.trim(),
    taskNumber: Number($("#task").value),
    attemptNumber: Number($("#attempt").value),
    prompt: $("#prompt").value,
    model: $("#model").value || null
  };
  if (!payload.baseline || !payload.taskNumber || !payload.attemptNumber) {
    alert('Baseline, task number, and attempt number are required.');
    return;
  }
  const res = await authedFetch('/api/experiments/start', {
    method: 'POST', body: JSON.stringify(payload)
  });
  if (res.ok) {
    $("#prompt").value = '';
    // The new experiment is now the "latest": clear user-touch flags so the
    // defaults roll forward (baseline, task, attempt+1) from it.
    startFormTouched.baseline = startFormTouched.task = startFormTouched.attempt = startFormTouched.model = false;
    refresh();
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$("#startBtn").addEventListener('click', startExperiment);
refresh();
setInterval(refresh, 5000);
</script>
